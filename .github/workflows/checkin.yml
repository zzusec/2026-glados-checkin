name: GLaDOS 2026 Checkin

on:
  schedule:
    # 北京时间 9:30 (UTC 1:30)
    - cron: '30 1 * * *'
    # 北京时间 21:30 (UTC 13:30)
    - cron: '30 13 * * *'
    # 每月两次保持仓库活跃，降低公开仓库的定时任务因 60 天无活动被停用的风险
    - cron: '17 0 1,15 * *'
  workflow_dispatch:  # 允许手动触发
  push:
    branches: [main]  # 推送时也触发，保持活跃

jobs:
  checkin:
    if: github.event.schedule != '17 0 1,15 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Checkin
        run: |
          for attempt in 1 2; do
            if python checkin.py; then
              exit 0
            fi

            if [ "$attempt" -lt 2 ]; then
              echo "First attempt failed, retrying in 60s..."
              sleep 60
            fi
          done

          exit 1
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}

  keep-active:
    if: github.event_name == 'schedule' && github.event.schedule == '17 0 1,15 * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Timestamp
        run: |
          echo "Last active: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .github/last-active.txt

      - name: Commit Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/last-active.txt
          git diff --staged --quiet || git commit -m "chore: keep repository active [skip ci]"
          git push
